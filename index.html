<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#103c43"><title>PhysioLab — Sinapses</title><style>
:root{--b:#f4f8f7;--c:#fff;--i:#17383d;--m:#687b7e;--a:#14777d;--s:#dceceb;--l:#dbe6e4;--g:#34725d}*{box-sizing:border-box}body{margin:0;background:var(--b);font-family:system-ui,-apple-system,sans-serif;color:var(--i)}main{max-width:590px;margin:auto;padding:24px 18px 90px}.tag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:900;color:var(--a)}h1{font-size:42px;margin:8px 0}h2{font-size:28px}p{color:var(--m);line-height:1.5}.card{background:var(--c);border:1px solid var(--l);border-radius:22px;padding:17px;margin:12px 0}.btn,.choice{width:100%;padding:15px;margin-top:9px;border-radius:16px;font:inherit;font-weight:800}.btn{border:0;background:var(--i);color:white}.choice{border:1px solid var(--l);background:white;text-align:left}.row{display:flex;gap:12px;align-items:center}.ico{width:46px;height:46px;border-radius:14px;background:var(--s);display:grid;place-items:center;flex:none}.meter{height:9px;background:#e1e9e7;border-radius:9px;overflow:hidden}.meter i{display:block;height:100%;background:var(--a)}.flow{display:flex;gap:6px;overflow:auto}.flow span{white-space:nowrap;background:var(--s);padding:8px;border-radius:99px;font-size:12px;font-weight:800}.good{outline:2px solid var(--g)}.bad{outline:2px solid #b96868}.big{text-align:center;font-size:58px;font-weight:900;color:var(--a)}
</style></head><body><main id="app"></main><script>
const A=document.querySelector("#app");let d=JSON.parse(localStorage.getItem("synv3")||'{"done":[],"xp":0,"best":0}'),v="home",block=false,stim=false,q=0,score=0;
const S=[["base","🔌","Antes da sinapse"],["compare","↔️","Elétrica × química"],["chemical","🧪","Sinapse química"],["lab","🔬","Laboratório de Ca²⁺"],["epsp","⚡","EPSP × IPSP"],["sum","➕","Somação"],["nt","🧠","Neurotransmissores"],["clinical","🩺","Caso clínico"],["final","🏆","Desafio final"]];
const Q=[["A chegada do PA abre principalmente:",["Canais de Ca²⁺ voltagem-dependentes","Receptores de GABA","Canais de Cl⁻ pós-sinápticos"],0],["Bloquear Ca²⁺ pré-sináptico tende a:",["Reduzir neurotransmissor liberado","Aumentar exocitose","Aumentar mielina"],0],["Um EPSP tende a:",["Aumentar a chance de atingir o limiar","Impedir toda resposta","Sempre hiperpolarizar"],0],["Estímulos rápidos da mesma entrada são:",["Somação temporal","Somação espacial","Condução saltatória"],0],["Entradas diferentes chegando juntas são:",["Somação espacial","Somação temporal","Período refratário"],0]];
function save(){localStorage.setItem("synv3",JSON.stringify(d))}function mark(x,n=25){if(!d.done.includes(x)){d.done.push(x);d.xp+=n;save()}}function go(x){v=x;render();scrollTo(0,0)}
function top(t){return `<button onclick="go('module')" style="border:0;background:none;font-size:28px">‹</button><span style="float:right;background:var(--s);padding:7px 10px;border-radius:99px;font-size:12px;font-weight:800">${t}</span>`}
function home(){return `<div class=tag>PhysioLab</div><h1>Sinapses</h1><p>Aprenda transmissão e integração sináptica pelo mecanismo.</p><div class=card><div class=row><div class=ico>🧠</div><div><b>Neurofisiologia</b><p style="margin:3px 0">Primeiro módulo completo</p></div></div><button class=btn onclick="go('module')">Entrar no módulo</button></div><div class=card><b>${d.xp} XP</b><p>Progresso salvo neste aparelho.</p></div>`}
function module(){let p=Math.round(d.done.length/S.length*100);return `<div class=tag>Neurofisiologia</div><h2>Trilha de Sinapses — ${p}%</h2><div class=meter><i style="width:${p}%"></i></div>${S.map(x=>`<div class="card row" onclick="go('${x[0]}')"><div class=ico>${d.done.includes(x[0])?"✓":x[1]}</div><b>${x[2]}</b></div>`).join("")}`}
function page(id,title,body,next){mark(id);return `${top(title)}<div class=tag>Sinapses</div><h2>${title}</h2>${body}<button class=btn onclick="go('${next}')">Continuar</button>`}
function lab(){mark("lab",100);let msg=!stim?"Bloqueie ou mantenha o Ca²⁺ normal e aplique o PA.":block?"O PA chega, mas sem entrada adequada de Ca²⁺ a exocitose vesicular cai intensamente.":"A despolarização abre canais de Ca²⁺; sua entrada favorece fusão vesicular e liberação do neurotransmissor.";return `${top("Laboratório")}<div class=tag>Experimento</div><h2>Controle o Ca²⁺</h2><div class=card><div class=big>${stim?(block?"Ca²⁺ ✕":"Ca²⁺ ↓"):"—"}</div><p>${msg}</p><button class=choice onclick="block=!block;stim=false;render()">${block?"✓ Ca²⁺ bloqueado":"Bloquear Ca²⁺"}</button><button class=btn onclick="stim=true;render()">⚡ Aplicar potencial de ação</button></div><button class=btn onclick="go('epsp')">Continuar</button>`}
function clinical(){mark("clinical",50);return `${top("Caso clínico")}<div class=tag>Raciocínio</div><h2>Onde está a falha?</h2><div class=card><p>Uma substância reduz intensamente a entrada de Ca²⁺ pré-sináptico, mas o PA chega normalmente.</p><b>Evento mais diretamente afetado:</b><button class=choice onclick="this.classList.add('good')">Liberação de neurotransmissores</button><button class=choice onclick="this.classList.add('bad')">Propagação do PA no axônio</button></div><button class=btn onclick="start()">Desafio final</button>`}
function start(){q=0;score=0;v="final";render()}function final(){let x=Q[q];return `${top("Desafio final")}<div class=tag>${q+1}/${Q.length}</div><h2>${x[0]}</h2>${x[1].map((a,i)=>`<button class=choice onclick="ans(${i},this)">${a}</button>`).join("")}<div id=f></div>`}
function ans(i,e){document.querySelectorAll(".choice").forEach((b,j)=>{b.disabled=true;if(j===Q[q][2])b.classList.add("good")});if(i===Q[q][2])score++;else e.classList.add("bad");document.querySelector("#f").innerHTML=`<div class=card><b>${i===Q[q][2]?"Correto":"Revise o mecanismo"}</b><p>A resposta correta está destacada.</p></div><button class=btn onclick="${q===Q.length-1?"finish()":"q++;render()"}">${q===Q.length-1?"Resultado":"Próxima"}</button>`}
function finish(){let p=Math.round(score/Q.length*100);d.best=Math.max(d.best,p);mark("final",100);save();v="result";render()}
function render(){if(v==="home")A.innerHTML=home();else if(v==="module")A.innerHTML=module();else if(v==="base")A.innerHTML=page("base","Antes da sinapse",`<div class=card><p>O potencial de ação despolariza o terminal pré-sináptico. Na sinapse química, isso abre canais de Ca²⁺ voltagem-dependentes.</p></div><div class=flow><span>PA</span><span>→ despolarização</span><span>→ Ca²⁺</span></div>`,"compare");else if(v==="compare")A.innerHTML=page("compare","Elétrica × química",`<div class=card><b>Elétrica</b><p>Junções gap; transmissão muito rápida; pode ser bidirecional.</p></div><div class=card><b>Química</b><p>Neurotransmissores, receptores e atraso sináptico; tipicamente unidirecional.</p></div>`,"chemical");else if(v==="chemical")A.innerHTML=page("chemical","Sinapse química",`<div class=flow><span>PA</span><span>Ca²⁺</span><span>Vesículas</span><span>NT</span><span>Receptor</span><span>Resposta</span></div><div class=card><ol><li>PA chega.</li><li>Ca²⁺ entra.</li><li>Vesículas fundem.</li><li>NT é liberado.</li><li>Receptores são ativados.</li></ol></div>`,"lab");else if(v==="lab")A.innerHTML=lab();else if(v==="epsp")A.innerHTML=page("epsp","EPSP × IPSP",`<div class=card><b>EPSP</b><p>Aumenta a probabilidade de atingir o limiar.</p></div><div class=card><b>IPSP</b><p>Reduz a probabilidade de atingir o limiar. O efeito depende do receptor e dos íons envolvidos.</p></div>`,"sum");else if(v==="sum")A.innerHTML=page("sum","Somação",`<div class=card><b>Temporal</b><p>Sinais sucessivos da mesma entrada próximos no tempo.</p></div><div class=card><b>Espacial</b><p>Sinais de diferentes entradas integrados pela célula.</p></div>`,"nt");else if(v==="nt")A.innerHTML=page("nt","Neurotransmissores",`<div class=card><b>Glutamato</b><p>Principal excitatório do SNC adulto.</p><b>GABA</b><p>Principal inibitório do SNC adulto.</p><b>Acetilcolina</b><p>Importante na junção neuromuscular e em vias autonômicas e centrais.</p></div>`,"clinical");else if(v==="clinical")A.innerHTML=clinical();else if(v==="final")A.innerHTML=final();else A.innerHTML=`<div class=tag>Módulo concluído</div><div class=big>${Math.round(score/Q.length*100)}%</div><h2 style="text-align:center">Sinapses</h2><p style="text-align:center">Melhor resultado: ${d.best}%</p><div class=card><b>🏆 Sinapse dominada</b><p>Você percorreu transmissão, integração e aplicação clínica.</p></div><button class=btn onclick="go('module')">Voltar</button>`}render();
</script></body></html>
